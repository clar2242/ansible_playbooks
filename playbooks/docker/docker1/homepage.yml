---
- name: install homepage on docker1
  hosts: docker1.srv.3fr.uk
  gather_facts: false
  tasks:
    - community.docker.docker_container:
        name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        pull: true
        hostname: homepage
        restart_policy: always
        networks:
          - name: web
        dns_servers:
          - 192.168.250.53
        env:
          HOMEPAGE_ALLOWED_HOSTS: "homepage.svc.3fr.uk"
          PUID: "1000"
          PGID: "1000"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /home/scott/config/homepage:/app/config
        labels:
          caddy: homepage.svc.3fr.uk
          caddy.import_0: httpauth_3fr
          caddy.import_1: accesslogs
          caddy.reverse_proxy: !unsafe "{{ upstreams 3000 }}"
          kuma.homepage.http.name: "Homepage"
          kuma.homepage.http.url: "https://homepage.svc.3fr.uk"
    - name: Create homepage.svc.3fr.uk CNAME
      delegate_to: localhost
      no_log: true
      ansible.builtin.uri:
        url: https://dns.srv.3fr.uk/api/zones/records/add
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ dns_token }}"
          domain: homepage.svc.3fr.uk
          type: CNAME
          ttl: 60
          cname: "{{ inventory_hostname }}"
          overwrite: true
        status_code: 200